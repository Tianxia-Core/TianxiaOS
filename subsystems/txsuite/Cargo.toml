[package]
name = "txsuite"
version = "0.1.0"
edition = "2021"

[dependencies]
sha3 = "0.10"
sha2 = "0.10"
blake2 = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 3
lto = true
strip = true
