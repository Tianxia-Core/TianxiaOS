[package]
name = "tx-ephemeral-hud"
version = "0.5.0"
edition = "2021"

[dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-backend = "0.3"
calloop = "0.13"
memmap2 = "0.9"
rustix = { version = "0.38", features = ["fs", "mm", "net"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
