<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1.0" />
      <stop offset="100%" stop-color="#008899" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="emberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5533" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" fill="#080808" />
  
  <!-- Outer Hexagonal Frame -->
  <polygon points="256,32 448,142 448,370 256,480 64,370 64,142" 
           fill="none" stroke="#27272A" stroke-width="4" />
  
  <!-- Active Cybernetic Lattice -->
  <polygon points="256,48 432,150 432,362 256,464 80,362 80,150" 
           fill="none" stroke="url(#cyanGlow)" stroke-width="2" filter="url(#neonBlur)" opacity="0.6" />

  <!-- Core Tripartite Vector (Rasa-X-Machina Monogram) -->
  <path d="M 256 128 L 368 336 L 144 336 Z" 
        fill="none" stroke="url(#cyanGlow)" stroke-width="12" stroke-linejoin="miter" filter="url(#neonBlur)" />
  
  <path d="M 256 192 L 320 304 L 192 304 Z" 
        fill="none" stroke="url(#emberGlow)" stroke-width="6" stroke-linejoin="miter" />

  <!-- Center Focal Core -->
  <circle cx="256" cy="268" r="16" fill="#00F0FF" filter="url(#neonBlur)" />
  <circle cx="256" cy="268" r="6" fill="#080808" />
  
  <!-- Data Node Indicators -->
  <circle cx="256" cy="32" r="6" fill="#FF5533" />
  <circle cx="448" cy="142" r="6" fill="#00F0FF" />
  <circle cx="448" cy="370" r="6" fill="#00F0FF" />
  <circle cx="256" cy="480" r="6" fill="#FFAA00" />
  <circle cx="64" cy="370" r="6" fill="#00F0FF" />
  <circle cx="64" cy="142" r="6" fill="#00F0FF" />
</svg>
